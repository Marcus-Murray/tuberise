version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tuberise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuberise_dev
      POSTGRES_USER: tuberise_user
      POSTGRES_PASSWORD: tuberise_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - tuberise-network

  redis:
    image: redis:7-alpine
    container_name: tuberise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tuberise-network

volumes:
  postgres_data:
  redis_data:

networks:
  tuberise-network:
    driver: bridge
